<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Dino Desert Runner</title>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9243381326991051"
     crossorigin="anonymous"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f0e8;
  font-family: Arial, sans-serif;
  color: #3b3028;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}

main {
  width: min(100%, 1200px);
  padding: 16px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  direction: ltr;
  margin-bottom: 10px;
}

.title {
  font-weight: 800;
  font-size: 20px;
}

.score {
  font: 700 24px monospace;
  letter-spacing: 1px;
}

.game {
  position: relative;
  overflow: hidden;
  border-radius: 14px;
  box-shadow: 0 8px 30px #5b402522;
  background: #d9b27d;
}

.game canvas {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 16/7;
  touch-action: manipulation;
}

.panel {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: #f8ecdccc;
}

.dialog {
  text-align: center;
  background: #fff7e8ee;
  border: 1px solid #b99368;
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 10px 35px #4b301c22;
}

.dialog h1 {
  font-size: 30px;
  margin: 0 0 10px;
}

.dialog p {
  font-size: 15px;
  margin: 0 0 18px;
}

.btn {
  border: 1px solid #65472f;
  background: #65472f;
  color: #fff;
  border-radius: 8px;
  padding: 12px 22px;
  font-weight: bold;
  cursor: pointer;
}

.btn:hover {
  background: #805b3d;
}

.controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 12px;
}

.hint {
  text-align: center;
  color: #786858;
  font-size: 13px;
  margin-top: 10px;
}

.hidden {
  display: none !important;
}

/* مساحة إعلان أسفل اللعبة */
.ad-container {
  min-height: 90px;
  margin: 18px auto;
  text-align: center;
}
</style>
</head>

<body>
<main>

  <div class="top">
    <div class="title">🦖 Dino Desert Runner</div>
    <div class="score" id="score">HI 000000 000000</div>
  </div>

  <div class="game">
    <canvas
      id="canvas"
      width="1200"
      height="525"
      aria-label="لعبة ديناصور في صحراء واقعية">
    </canvas>

    <div class="panel" id="start">
      <div class="dialog">
        <h1>🦖 Dino Desert</h1>
        <p>اركض في الصحراء وتفادى الصبار والصخور</p>
        <button class="btn" id="play">ابدأ اللعب</button>
      </div>
    </div>

    <div class="panel hidden" id="over">
      <div class="dialog">
        <h1>انتهت اللعبة</h1>
        <p id="result"></p>
        <button class="btn" id="again">إعادة اللعب</button>
      </div>
    </div>
  </div>

  <!-- =========================================
       إعلان أسفل اللعبة
       بعد موافقة AdSense، ضع كود الوحدة
       الإعلانية هنا إذا أعطاك Google كودًا
       ========================================= -->

  <div class="ad-container">

    <!-- الصق كود وحدة الإعلان هنا بعد الموافقة -->

    <!-- مثال فقط:
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-XXXXXXXXXXXX"
         data-ad-slot="XXXXXXXXXX"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>

    <script>
      (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
    -->

  </div>

  <div class="controls">
    <button class="btn" id="jump">⬆ قفز</button>
    <button class="btn" id="reset">↻ إعادة</button>
  </div>

  <div class="hint">
    Space / ↑ للقفز — R لإعادة اللعب — اضغط على الشاشة في الجوال
  </div>

</main>

<script>
(() => {
  const c = document.getElementById('canvas');
  const x = c.getContext('2d');

  const W = c.width;
  const H = c.height;
  const ground = 405;

  let state = 'ready';
  let score = 0;
  let best = 0;
  let speed = 520;
  let last = 0;
  let spawn = 1.5;
  let player;
  let obs = [];
  let clouds = [];
  let dust = [];
  let sunX = 980;

  const $ = id => document.getElementById(id);

  const rand = (a, b) => a + Math.random() * (b - a);

  function reset() {
    score = 0;
    speed = 520;
    spawn = 1.5;
    obs = [];
    dust = [];

    clouds = [
      { x: 80, y: 105, w: 90 },
      { x: 520, y: 75, w: 120 },
      { x: 930, y: 125, w: 80 }
    ];

    player = {
      x: 180,
      y: ground - 82,
      w: 58,
      h: 82,
      vy: 0,
      on: true,
      frame: 0
    };

    hud();
    draw();
  }

  function hud() {
    $('score').textContent =
      'HI ' +
      String(best).padStart(6, '0') +
      ' ' +
      String(Math.floor(score)).padStart(6, '0');
  }

  function start() {
    reset();
    state = 'playing';

    $('start').classList.add('hidden');
    $('over').classList.add('hidden');

    last = performance.now();
    requestAnimationFrame(loop);
  }

  function end() {
    state = 'over';
    best = Math.max(best, Math.floor(score));

    $('result').textContent =
      'النقاط: ' +
      Math.floor(score) +
      ' — الرقم القياسي: ' +
      best;

    $('over').classList.remove('hidden');
  }

  function jump() {
    if (state === 'ready' || state === 'over') {
      start();
      return;
    }

    if (state === 'playing' && player.on) {
      player.vy = -920;
      player.on = false;
    }
  }

  function rect(px, py, w, h, fill) {
    x.fillStyle = fill;
    x.fillRect(
      Math.round(px),
      Math.round(py),
      w,
      h
    );
  }

  function rounded(px, py, w, h, r, fill) {
    x.fillStyle = fill;
    x.beginPath();
    x.roundRect(px, py, w, h, r);
    x.fill();
  }

  function pixelDino() {
    const p = player;
    const ox = p.x;
    const oy = p.y;
    const phase = p.on ? Math.floor(p.frame / 5) % 2 : 0;

    const g = x.createLinearGradient(
      ox,
      oy,
      ox + 90,
      oy + 85
    );

    g.addColorStop(0, '#c99568');
    g.addColorStop(.42, '#9b6244');
    g.addColorStop(1, '#53382d');

    const belly = x.createLinearGradient(
      ox + 20,
      oy + 20,
      ox + 55,
      oy + 80
    );

    belly.addColorStop(0, '#d9ae7d');
    belly.addColorStop(1, '#8b563c');

    x.save();
    x.translate(ox, oy);

    // الجسم والذيل
    x.beginPath();
    x.moveTo(28, 31);
    x.quadraticCurveTo(8, 18, -5, 28);
    x.quadraticCurveTo(10, 43, 29, 47);
    x.lineTo(43, 60);
    x.lineTo(65, 62);
    x.lineTo(72, 38);
    x.lineTo(62, 19);
    x.lineTo(45, 16);
    x.closePath();
    x.fillStyle = g;
    x.fill();

    // الرقبة والرأس
    x.beginPath();
    x.moveTo(43, 31);
    x.lineTo(43, 9);
    x.quadraticCurveTo(47, 0, 61, 3);
    x.lineTo(77, 7);
    x.lineTo(84, 17);
    x.lineTo(79, 31);
    x.lineTo(61, 35);
    x.lineTo(57, 48);
    x.closePath();
    x.fillStyle = g;
    x.fill();

    // الفم
    x.beginPath();
    x.moveTo(68, 12);
    x.lineTo(91, 15);
    x.lineTo(96, 24);
    x.lineTo(89, 31);
    x.lineTo(66, 29);
    x.closePath();
    x.fillStyle = g;
    x.fill();

    x.beginPath();
    x.moveTo(70, 29);
    x.lineTo(91, 29);
    x.lineTo(87, 36);
    x.lineTo(68, 34);
    x.closePath();
    x.fillStyle = '#4a3028';
    x.fill();

    // البطن
    x.beginPath();
    x.moveTo(37, 35);
    x.quadraticCurveTo(49, 40, 59, 38);
    x.lineTo(57, 64);
    x.quadraticCurveTo(45, 75, 30, 65);
    x.closePath();
    x.fillStyle = belly;
    x.fill();

    // الذراعان
    x.strokeStyle = '#6c4534';
    x.lineWidth = 6;
    x.lineCap = 'round';
    x.beginPath();
    x.moveTo(47, 43);
    x.lineTo(57, 53);
    x.lineTo(53, 60);
    x.moveTo(52, 52);
    x.lineTo(61, 54);
    x.stroke();

    // الرجلان
    x.strokeStyle = '#5a3b2e';
    x.lineWidth = 9;
    x.beginPath();
    x.moveTo(34, 62);
    x.lineTo(29 + (phase ? 5 : 0), 78);
    x.lineTo(20 + (phase ? 5 : 0), 82);
    x.moveTo(53, 62);
    x.lineTo(57 - (phase ? 5 : 0), 78);
    x.lineTo(69 - (phase ? 5 : 0), 82);
    x.stroke();

    // القدم
    x.strokeStyle = '#30241f';
    x.lineWidth = 5;
    x.beginPath();
    x.moveTo(18 + (phase ? 5 : 0), 82);
    x.lineTo(31 + (phase ? 5 : 0), 82);
    x.moveTo(56 - (phase ? 5 : 0), 82);
    x.lineTo(72 - (phase ? 5 : 0), 82);
    x.stroke();

    // العين
    x.fillStyle = '#201713';
    x.beginPath();
    x.arc(72, 13, 3.2, 0, Math.PI * 2);
    x.fill();

    x.fillStyle = '#f4d7a0';
    x.beginPath();
    x.arc(73, 12, 1, 0, Math.PI * 2);
    x.fill();

    // فتحة الأنف
    x.fillStyle = '#2e1d17';
    x.beginPath();
    x.arc(88, 22, 1.6, 0, Math.PI * 2);
    x.fill();

    // الأسنان
    x.fillStyle = '#f8e5c0';

    for (let i = 0; i < 4; i++) {
      x.fillRect(73 + i * 4, 29, 2, 4);
    }

    // لمعان الجلد
    x.strokeStyle = '#d4a078';
    x.lineWidth = 2;
    x.beginPath();
    x.moveTo(18, 36);
    x.lineTo(29, 40);
    x.moveTo(46, 20);
    x.lineTo(52, 12);
    x.moveTo(39, 49);
    x.lineTo(45, 53);
    x.stroke();

    x.restore();
  }

  function cactus(o) {
    const ox = o.x;
    const base = ground;
    const h = o.h;
    const s = o.s || 1;
    const stemW = 22 * s;

    const grad = x.createLinearGradient(
      ox - 12 * s,
      base - h,
      ox + 48 * s,
      base
    );

    grad.addColorStop(0, '#9caf78');
    grad.addColorStop(.28, '#557448');
    grad.addColorStop(.7, '#315238');
    grad.addColorStop(1, '#203a2a');

    rounded(
      ox + 18 * s,
      base - h,
      stemW,
      h,
      stemW / 2,
      grad
    );

    rounded(
      ox + 5 * s,
      base - h * .58,
      13 * s,
      h * .3,
      6 * s,
      grad
    );

    rounded(
      ox - 2 * s,
      base - h * .58,
      20 * s,
      12 * s,
      6 * s,
      grad
    );

    rounded(
      ox + 39 * s,
      base - h * .42,
      13 * s,
      h * .28,
      6 * s,
      grad
    );

    rounded(
      ox + 39 * s,
      base - h * .42,
      20 * s,
      12 * s,
      6 * s,
      grad
    );

    for (let k = 0; k < 5; k++) {
      x.strokeStyle = 'rgba(210,224,166,.48)';
      x.lineWidth = 1.2 * s;
      x.beginPath();
      x.moveTo(
        ox + (21 + k * 2) * s,
        base - h + 10
      );
      x.lineTo(
        ox + (19 + k * 2) * s,
        base - 10
      );
      x.stroke();
    }

    x.strokeStyle = '#c0cc91';
    x.lineWidth = 1.5 * s;
    x.beginPath();
    x.moveTo(
      ox + 25 * s,
      base - h + 8
    );
    x.lineTo(
      ox + 25 * s,
      base - 8
    );
    x.moveTo(
      ox + 12 * s,
      base - h * .55
    );
    x.lineTo(
      ox + 12 * s,
      base - h * .3
    );
    x.moveTo(
      ox + 45 * s,
      base - h * .38
    );
    x.lineTo(
      ox + 45 * s,
      base - h * .18
    );
    x.stroke();

    for (let k = 0; k < 9; k++) {
      const yy = base - h + 12 + k * (h - 20) / 9;
      x.fillStyle = '#d5d9a2';
      x.fillRect(
        ox + (k % 2 ? 15 : 33) * s,
        yy,
        2 * s,
        2 * s
      );
    }
  }

  function pyramid(px, py, w, h) {
    const left = px - w / 2;
    const right = px + w / 2;
    const top = py - h;

    const g = x.createLinearGradient(
      px - w / 2,
      top,
      px + w / 2,
      py
    );

    g.addColorStop(0, '#f1d39a');
    g.addColorStop(1, '#b67d4d');

    x.fillStyle = g;
    x.beginPath();
    x.moveTo(px, top);
    x.lineTo(right, py);
    x.lineTo(left, py);
    x.closePath();
    x.fill();

    x.fillStyle = '#9b6845';
    x.beginPath();
    x.moveTo(px, top);
    x.lineTo(right, py);
    x.lineTo(px + 8, py);
    x.closePath();
    x.fill();

    x.strokeStyle = 'rgba(112,73,44,.38)';
    x.lineWidth = 2;

    for (let yy = py - 12; yy > top + 8; yy -= 13) {
      const t = (py - yy) / h;
      const half = (w / 2) * (1 - t);

      x.beginPath();
      x.moveTo(px - half, yy);
      x.lineTo(px + half, yy);
      x.stroke();
    }

    x.strokeStyle = 'rgba(255,235,184,.35)';
    x.beginPath();
    x.moveTo(px, top);
    x.lineTo(left, py);
    x.stroke();
  }

  function cloud(cl) {
    x.strokeStyle = '#eadfce';
    x.lineWidth = 3;
    x.beginPath();
    x.moveTo(cl.x, cl.y + 20);
    x.lineTo(cl.x + cl.w, cl.y + 20);
    x.moveTo(cl.x + 8, cl.y + 20);
    x.quadraticCurveTo(
      cl.x + 15,
      cl.y - 5,
      cl.x + 35,
      cl.y + 5
    );
    x.quadraticCurveTo(
      cl.x + 60,
      cl.y - 18,
      cl.x + 78,
      cl.y + 7
    );
    x.quadraticCurveTo(
      cl.x + cl.w - 5,
      cl.y + 3,
      cl.x + cl.w,
      cl.y + 20
    );
    x.stroke();
  }

  function mountain(px, py, w, h, fill) {
    x.fillStyle = fill;
    x.beginPath();
    x.moveTo(px - w / 2, py);
    x.lineTo(px - w * .18, py - h * .65);
    x.lineTo(px, py - h);
    x.lineTo(px + w * .2, py - h * .55);
    x.lineTo(px + w / 2, py);
    x.closePath();
    x.fill();
  }

  function draw() {
    const sky = x.createLinearGradient(0, 0, 0, H);

    sky.addColorStop(0, '#86b9d9');
    sky.addColorStop(.62, '#e8c99b');
    sky.addColorStop(1, '#d6a56d');

    x.fillStyle = sky;
    x.fillRect(0, 0, W, H);

    const glow = x.createRadialGradient(
      sunX,
      70,
      5,
      sunX,
      70,
      100
    );

    glow.addColorStop(0, '#fff6bf');
    glow.addColorStop(1, '#fff6bf00');

    x.fillStyle = glow;
    x.fillRect(sunX - 110, -40, 220, 220);

    x.fillStyle = '#fff0ae';
    x.beginPath();
    x.arc(sunX, 70, 34, 0, Math.PI * 2);
    x.fill();

    clouds.forEach(cloud);

    mountain(160, 330, 360, 160, '#b37e59');
    mountain(440, 335, 430, 175, '#c18a60');
    mountain(790, 330, 450, 190, '#9f6d50');
    mountain(1080, 335, 350, 170, '#b77e58');

    pyramid(820, 335, 210, 145);
    pyramid(1010, 350, 150, 105);
    pyramid(650, 355, 115, 78);

    const sand = x.createLinearGradient(0, 330, 0, H);

    sand.addColorStop(0, '#efd09a');
    sand.addColorStop(.45, '#d8a66c');
    sand.addColorStop(1, '#a96f47');

    x.fillStyle = sand;
    x.fillRect(0, 330, W, H);

    for (let k = 0; k < 7; k++) {
      x.strokeStyle = 'rgba(120,78,47,.18)';
      x.lineWidth = 2;
      x.beginPath();
      x.moveTo(0, 350 + k * 24);
      x.quadraticCurveTo(
        W * .35,
        340 + k * 24,
        W,
        360 + k * 24
      );
      x.stroke();
    }

    x.strokeStyle = '#8e6045';
    x.lineWidth = 3;
    x.beginPath();
    x.moveTo(0, ground);
    x.lineTo(W, ground);
    x.stroke();

    for (let i = 0; i < W; i += 55) {
      x.fillStyle = i % 110 === 0 ? '#9b6e4c' : '#a97a53';
      x.fillRect(i, ground + 13, 5, 3);
    }

    for (let i = 0; i < 28; i++) {
      const px = (i * 83 + tickOffset()) % W;
      const py = ground + randStatic(i);

      x.fillStyle = i % 3 ? '#8d6042' : '#6f4a35';
      x.beginPath();
      x.ellipse(
        px,
        py,
        randStatic(i + 4),
        2,
        0,
        0,
        Math.PI * 2
      );
      x.fill();
    }

    obs
      .slice()
      .sort((a, b) => b.x - a.x)
      .forEach(cactus);

    pixelDino();

    dust.forEach(d => {
      x.globalAlpha = d.life;
      rect(d.x, d.y, 4, 3, '#8f6849');
      x.globalAlpha = 1;
    });
  }

  let visualT = 0;

  function tickOffset() {
    return (visualT * 35) % W;
  }

  function randStatic(i) {
    return 10 + (i * 37) % 75;
  }

  function update(dt) {
    visualT += dt;
    score += dt * 10;
    speed = Math.min(900, speed + dt * 5);

    spawn -= dt;

    player.frame++;

    if (spawn <= 0) {
      const h = 58 + Math.random() * 48;

      obs.push({
        x: W + 50,
        h,
        w: 56,
        s: .9 + Math.random() * .3
      });

      spawn = 1.35 + Math.random() * 1.35;
    }

    player.vy += 2400 * dt;
    player.y += player.vy * dt;

    if (player.y >= ground - player.h) {
      player.y = ground - player.h;
      player.vy = 0;
      player.on = true;
    }

    obs.forEach(o => {
      o.x -= speed * dt;
    });

    obs = obs.filter(o => o.x > -120);

    for (const o of obs) {
      if (
        o.x < player.x + player.w - 10 &&
        o.x + o.w > player.x + 10 &&
        player.y + player.h > ground - o.h + 8
      ) {
        end();
        return;
      }
    }

    clouds.forEach(cl => {
      cl.x -= speed * dt * .08;

      if (cl.x + cl.w < 0) {
        cl.x = W + Math.random() * 200;
      }
    });

    hud();
  }

  function loop(now) {
    if (state !== 'playing') return;

    const dt = Math.min(.035, (now - last) / 1000);

    last = now;

    update(dt);
    draw();

    if (state === 'playing') {
      requestAnimationFrame(loop);
    }
  }

  $('play').onclick = start;
  $('again').onclick = start;
  $('reset').onclick = start;
  $('jump').onclick = jump;

  c.addEventListener('pointerdown', jump);

  addEventListener('keydown', e => {
    if (
      e.code === 'Space' ||
      e.code === 'ArrowUp'
    ) {
      e.preventDefault();
      jump();
    }

    if (e.key.toLowerCase() === 'r') {
      start();
    }
  });

  reset();
})();
</script>

</body>
</html>
